<section class="card border-0 shadow-sm bg-white mt-3" aria-labelledby="experience-heading">
    <div class="card-body p-4">
        <h2 class="section-title" id="experience-heading">Industry Experience</h2>
        <ul class="experience-list list-unstyled mb-0">
            {% for item in site.data.profile.experience %}
            <li class="experience-entry">
                <img src="{{ item.logo | relative_url }}" alt="" class="experience-logo">
                <div class="experience-content">
                    <div class="experience-heading">
                        <div>
                            <h3 class="h5 mb-1">{{ item.name }}</h3>
                            <div>{{ item.position }}</div>
                        </div>
                        {% if item.date %}
                        <div class="experience-date small text-muted">{{ item.date }}</div>
                        {% endif %}
                    </div>
                    <p class="experience-description mb-0">{{ item.description }}</p>
                </div>
            </li>
            {% endfor %}
        </ul>
    </div>
</section>
