short_bio: >-
  <p>
    I work on <strong>LLM post-training, agentic AI, and machine learning for health</strong>.
    I am a final-year Ph.D. candidate at the University of Florida, advised by
    <a href="https://www.jiangteam.org/" target="_blank" rel="noopener">Dr. Zhe Jiang</a>,
    with expected graduation in May 2027.
  </p>
  <p>
    I have worked as an <strong>Applied Scientist Intern at Amazon</strong> and an
    <strong>Applied Researcher Intern at eBay</strong>.
    My research develops methods for temporal and graph learning, with publications at
    <strong>ICLR, ICML, NeurIPS, AAAI, and MICCAI</strong>, and an ACM SIGSPATIAL Best Paper Award.
  </p>

