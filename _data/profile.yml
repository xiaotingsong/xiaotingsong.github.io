short_bio: >-
  <p>
    Tingsong Xiao is a third-year PhD candidate in Computer Science at the University of Florida, supervised by <a href="https://www.jiangteam.org/" target="_blank">Dr. Zhe Jiang</a>. His research focuses on <strong>Deep Learning, Large Language Model (LLM), Generative Artificial Intelligence.</strong>.
  </p>
  <p>
    He earned his Bachelor of Engineering in Data Science and Big Data Technology from the University of Electronic Science and Technology of China (UESTC) in 2021, graduating with distinction. 
    During his undergraduate studies, he conducted research on recommendation systems and medical image analysis. With a strong emphasis on medical applications, his current work focuses on developing innovative algorithms for AI in healthcare. 
    He has published papers in prestigious conferences, including NeurIPS, AAAI, MICCAI, and ACM SIGSPATIAL. He has received recognitions such as the ACM SIGSPATIAL 2023 Best Paper Award and the MICCAI 2022 Student Travel Award. 
    He is also an active contributor to the academic community, serving as a reviewer for leading journals and conferences such as NeurIPS, ICML, ICLR, and IEEE Transactions.
  </p>

