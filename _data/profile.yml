  date: May 2026 - Aug 2026
  description: >-
    Developed <strong>LLM agentic planning</strong> methods for <strong>long-horizon tasks</strong>,
    using <strong>test-time search</strong> and cross-trajectory feedback to guide multi-step decisions.
    Explored <strong>world models</strong> for simulating action outcomes and built <strong>evaluation pipelines</strong>
    to assess planning quality, constraint satisfaction, and search efficiency.
- name: eBay
  logo: /assets/images/badges/eBay_logo.png
  position: Applied Researcher Intern
  date: May 2025 - Aug 2025
  description: >-
    Worked on <strong>LLM post-training</strong> for product attribute extraction,
    including <strong>knowledge distillation</strong> and <strong>fine-tuning</strong> of compact language models.
    Constructed <strong>domain-specific training datasets</strong> from e-commerce product descriptions
    and evaluated models for extraction quality and inference efficiency.

